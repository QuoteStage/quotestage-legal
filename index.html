<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuoteStage Legal & Service Information</title>
  <meta name="description" content="Public service information and privacy disclosures for QuoteStage tools.">
  <style>
    :root{color-scheme:light;--ink:#172033;--muted:#5d6678;--line:#dfe4ec;--accent:#3157d5;--panel:#fff;--bg:#f6f8fb}
    *{box-sizing:border-box}body{margin:0;font:16px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
    main{max-width:760px;margin:0 auto;padding:72px 24px}article{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:40px;box-shadow:0 12px 36px rgba(23,32,51,.07)}
    h1{margin:0 0 12px;font-size:clamp(2rem,5vw,3.2rem);line-height:1.1}p{color:var(--muted)}nav{display:grid;gap:12px;margin-top:32px}
    a{color:var(--accent)}nav a{display:block;padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:#fff;text-decoration:none;font-weight:650}nav a:hover{border-color:var(--accent)}
    footer{margin-top:28px;font-size:.9rem;color:var(--muted)}
  </style>
</head>
<body>
  <main>
    <article>
      <h1>QuoteStage</h1>
      <p>Public information and privacy disclosures for QuoteStage-operated services.</p>
      <nav aria-label="Service pages">
        <a href="./ava-scheduling/">Ava Scheduling Assistant</a>
        <a href="./privacy/">Privacy Policy</a>
      </nav>
      <footer>Last updated October 28, 2026.</footer>
    </article>
  </main>
</body>
</html>
